name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ランナーの MSVC が更新されると、キャッシュに残った CMake の設定が古いコンパイラを指して whisper のビルドが失敗する
      - name: Drop stale CMake build directories
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target -Recurse -Filter CMakeCache.txt -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item $_.Directory.FullName -Recurse -Force }

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Build the Rust backend
        working-directory: src-tauri
        run: cargo build --locked

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

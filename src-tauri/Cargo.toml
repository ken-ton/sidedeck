[package]
name = "sidedeck"
version = "0.3.0"
description = "Turn a touchscreen monitor into a Stream Deck-style button panel for Windows"
authors = ["KT"]
license = "MIT"
repository = "https://github.com/ken-ton/sidedeck"
edition = "2024"

[lib]
# The `_lib` suffix is necessary to avoid a name clash with the bin on Windows.
name = "sidedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
base64 = "0.22"
png = "0.17"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_UI_ColorSystem",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
